# M1-2 生产编排：完整栈（中间件 + app + web），面向 2C4G 单机
# 用法：./scripts/deploy.sh   （内部即 docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build）
# ai 服务（Python）在 M3 加入本文件，内存预算已按 PRD §7.3 预留
name: codelab

services:
  postgres:
    image: postgres:16-alpine
    container_name: codelab-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelab}
      POSTGRES_USER: ${POSTGRES_USER:-codelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/backups:/backups
    mem_limit: 450m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codelab} -d ${POSTGRES_DB:-codelab}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codelab-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 100m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: codelab-mq-namesrv
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
      TZ: ${TZ:-Asia/Shanghai}
    mem_limit: 200m
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: codelab-mq-broker
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn256m"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    depends_on:
      - rocketmq-namesrv
    mem_limit: 500m
    restart: unless-stopped

  minio:
    # MinIO 社区镜像已从 Docker Hub 下架，官方当前分发在 quay.io。
    # 若 quay.io 匿名拉取受限，可用 cgr.dev/chainguard/minio 或任意 S3 兼容服务（改 MINIO_IMAGE 即可）
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    container_name: codelab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 里设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 里设置 MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    mem_limit: 200m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ../services/app
    container_name: codelab-app
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codelab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codelab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?请在 .env 里设置 APP_JWT_SECRET}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.edu}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?请在 .env 里设置 APP_ADMIN_PASSWORD}
      APP_DB_MIGRATION_DIR: /app/db
      LOG_DIR: /app/logs
      # 文件存储：生产必须走 MinIO（PRD §14.1 D2）
      APP_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?请在 .env 里设置 MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 里设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-codelab}
      # 判题（PRD §14.6）：容器内以 judge 用户跑学生代码
      APP_JUDGE_ENABLED: "true"
      APP_JUDGE_DIR: /data/judge
      APP_JUDGE_RUN_AS_USER: judge
      APP_JUDGE_CONCURRENCY: ${APP_JUDGE_CONCURRENCY:-2}
      APP_JUDGE_MAX_QUEUE: ${APP_JUDGE_MAX_QUEUE:-20}
      APP_ASSIGNMENT_ALLOW_LATE: ${APP_ASSIGNMENT_ALLOW_LATE:-false}
      # AI 编排服务（M3）：app 只通过内部网络调 ai
      APP_AI_ENABLED: ${APP_AI_ENABLED:-true}
      AI_BASE_URL: http://ai:8080
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?请在 .env 里设置 AI_INTERNAL_TOKEN}
      APP_AI_CACHE_TTL_MINUTES: ${APP_AI_CACHE_TTL_MINUTES:-30}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-25}
      JAVA_TOOL_OPTIONS: -Xmx640m -Xss512k
    volumes:
      - ./db:/app/db:ro
      - ./logs:/app/logs
      - appjudge:/data/judge
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai:
        condition: service_healthy
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  ai:
    build:
      context: ../services/ai
    container_name: codelab-ai
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1000}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-18}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?请在 .env 里设置 AI_INTERNAL_TOKEN}
    # 不映射宿主机端口：ai 只在容器网络内被 app 调用（PRD §15.1 D6）
    expose:
      - "8080"
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: codelab-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_started
    mem_limit: 200m
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  appjudge:
