# RocketMQ broker 配置（单机）
# dev：brokerIP1 用宿主机回环，本机 app 才能连上；服务器部署改成对应网卡 IP
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 5.x 默认开启，4GB 机器必须关：自动创建 topic 反而更省心
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 回调地址：每个环境必须改成本机实际可达地址，否则客户端拿到的是容器内网 IP
# dev 示例（宿主机直连）：brokerIP1 = 127.0.0.1
# prod 示例：brokerIP1 = <ECS 内网或公网 IP>
brokerIP1 = 127.0.0.1

# 磁盘保护：读写权限设为 8 = READ_ONLY，避免磁盘涨满后 broker 崩溃
diskMaxUsedSpaceRatio = 88
