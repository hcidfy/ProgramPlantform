server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

spring:
  application:
    name: codelab-app
  servlet:
    multipart:
      max-file-size: 10MB      # 业务侧再卡 5MB（PRD §6.3），这里留一倍余量
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codelab}
    username: ${SPRING_DATASOURCE_USERNAME:codelab}
    password: ${SPRING_DATASOURCE_PASSWORD:codelab}
    hikari:
      maximum-pool-size: 8      # 2C4G：连接池不贪多
      minimum-idle: 2
      connection-timeout: 5000

app:
  jwt:
    # 生产必须替换（>=32 字符）；dev 默认值仅供本机
    secret: ${APP_JWT_SECRET:dev_only_change_me_please_32bytes_min_secret}
    issuer: codelab
    access-ttl: 2h
    refresh-ttl: 7d
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.edu}
    password: ${APP_ADMIN_PASSWORD:Admin@12345}
  migration:
    # 容器内 /app/db；本机直跑时按相对路径自动探测 ../../deploy/db
    dir: ${APP_DB_MIGRATION_DIR:}
  security:
    # 纯 HTTP 环境下必须 false，否则浏览器不存 refresh cookie
    cookie-secure: ${APP_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}

  # 文件存储：minio（生产）/ local（仅开发，见 PRD §14.1 D2）
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local-dir: ${APP_STORAGE_LOCAL_DIR:storage}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://minio:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:codelab}

  # 判题（PRD §14.6）
  judge:
    enabled: ${APP_JUDGE_ENABLED:true}
    dir: ${APP_JUDGE_DIR:judge-work}
    concurrency: ${APP_JUDGE_CONCURRENCY:2}
    max-queue: ${APP_JUDGE_MAX_QUEUE:20}
    # 生产容器内设 judge（配合 Dockerfile 里创建的同名系统用户），开发机留空
    run-as-user: ${APP_JUDGE_RUN_AS_USER:}
    python-cmd: ${APP_JUDGE_PYTHON:}
    retention-hours: ${APP_JUDGE_RETENTION_HOURS:24}
    max-cases: ${APP_JUDGE_MAX_CASES:20}

  assignment:
    # FR-TCH-02：截止后仍可看题，是否可提交由这个开关决定
    allow-late: ${APP_ASSIGNMENT_ALLOW_LATE:false}

  # AI 编排服务（M3）：app 只通过内部 HTTP 调它，不直接调模型
  ai:
    enabled: ${APP_AI_ENABLED:true}
    base-url: ${AI_BASE_URL:http://127.0.0.1:8081}
    internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token-change-me}
    cache-ttl-minutes: ${APP_AI_CACHE_TTL_MINUTES:30}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:25}
    max-tokens: ${APP_AI_MAX_TOKENS:1000}
    # 仅用于日志提示：ai 侧真实 provider 由 AI_PROVIDER 决定
    stub: ${APP_AI_STUB:true}
    # 配额默认值（没有 ai_quotas 覆盖时生效）；单题次数按 PRD §5.3"合计口径"
    default-daily-tokens: ${APP_AI_DEFAULT_DAILY_TOKENS:30000}
    default-per-problem-calls: ${APP_AI_DEFAULT_PER_PROBLEM_CALLS:10}
    # 月费用估算费率：分/百万 token；0 表示未配置，仪表盘不展示虚假的 0 元
    input-price-cents-per-million: ${APP_AI_INPUT_PRICE_CENTS_PER_MILLION:0}
    output-price-cents-per-million: ${APP_AI_OUTPUT_PRICE_CENTS_PER_MILLION:0}

logging:
  level:
    root: INFO
    com.codelab.app: ${APP_LOG_LEVEL:INFO}
